[package]
name = "w-synth"
version = "1.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
oxicode = { version = "0.2", features = ["simd", "compression"] }
biquad = "0.6"
hound = "3.5"
rand = "0.10"
rand_distr = "0.6"
regex = "1.13"
rsworld = {path="../rust-world/rsworld"}
rsworld-sys = {path="../rust-world/rsworld-sys"}
rubato = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm"] }

